services:
  localstack:
    container_name: ${LOCALSTACK_CONTAINER_NAME}
    image: localstack/localstack:3.0.0
    ports:
      - "4566:4566" # LocalStack Gateway
    environment:
      - DEBUG=1
      - services=s3,ssm,dynamodb,sqs
      - LAMBDA_EXECUTOR=local
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - "${LOCALSTACK_VOLUME_DIR:-./volume}:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
    env_file:
      - .env
    networks:
      - hadoop-yarn

  terraform:
    container_name: ${TERRAFORM_CONTAINER_NAME}
    image: hashicorp/terraform
    entrypoint: [ "/bin/sh" ]
    command: -c "terraform init && terraform apply --auto-approve"
    volumes:
      - "./main.tf:/main.tf"
    depends_on:
      - localstack
    env_file:
      - .env
    networks:
      - hadoop-yarn

  postgres:
    container_name: ${POSTGRES_CONTAINER_NAME}
    image: postgres:13.12
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - "./scripts/db/deployment:/docker-entrypoint-initdb.d"
    env_file:
      - .env
    networks:
      - hadoop-yarn

  # Hadoop NameNode
  namenode:
    container_name: ${NAMENODE_CONTAINER_NAME}
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    environment:
      - CLUSTER_NAME=retail-analytics
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - CORE_CONF_hadoop_http_staticuser_user=root
      - CORE_CONF_hadoop_proxyuser_hue_hosts=*
      - CORE_CONF_hadoop_proxyuser_hue_groups=*
      - CORE_CONF_io_compression_codecs=org.apache.hadoop.io.compress.SnappyCodec
      - HDFS_CONF_dfs_webhdfs_enabled=true
      - HDFS_CONF_dfs_permissions_enabled=false
      - HDFS_CONF_dfs_nameservices=hdfscluster
    ports:
      - "9870:9870"  # NameNode Web UI
      - "9000:9000"  # HDFS
    volumes:
      - hadoop_namenode:/hadoop/dfs/name
      - "./:/opt/shared:rw"
    networks:
      - hadoop-yarn
    env_file:
      - .env

  # Hadoop DataNode
  datanode:
    container_name: ${DATANODE_CONTAINER_NAME}
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    environment:
      - SERVICE_PRECONDITION=namenode:9870
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - CORE_CONF_hadoop_http_staticuser_user=root
      - CORE_CONF_hadoop_proxyuser_hue_hosts=*
      - CORE_CONF_hadoop_proxyuser_hue_groups=*
      - CORE_CONF_io_compression_codecs=org.apache.hadoop.io.compress.SnappyCodec
      - HDFS_CONF_dfs_webhdfs_enabled=true
      - HDFS_CONF_dfs_permissions_enabled=false
    ports:
      - "9864:9864"  # DataNode Web UI
    volumes:
      - hadoop_datanode:/hadoop/dfs/data
      - "./:/opt/shared:rw"
    networks:
      - hadoop-yarn
    depends_on:
      - namenode
    env_file:
      - .env

  # YARN ResourceManager
  resourcemanager:
    container_name: ${RESOURCEMANAGER_CONTAINER_NAME}
    image: bde2020/hadoop-resourcemanager:2.0.0-hadoop3.2.1-java8
    environment:
      - SERVICE_PRECONDITION=namenode:9000 namenode:9870 datanode:9864
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - CORE_CONF_hadoop_http_staticuser_user=root
      - YARN_CONF_yarn_log___aggregation___enable=true
      - YARN_CONF_yarn_log_server_url=http://historyserver:8188/applicationhistory/logs/
      - YARN_CONF_yarn_resourcemanager_recovery_enabled=true
      - YARN_CONF_yarn_resourcemanager_store_class=org.apache.hadoop.yarn.server.resourcemanager.recovery.FileSystemRMStateStore
      - YARN_CONF_yarn_resourcemanager_scheduler_class=org.apache.hadoop.yarn.server.resourcemanager.scheduler.capacity.CapacityScheduler
      - YARN_CONF_yarn_scheduler_capacity_root_default_maximum___allocation___mb=2048
      - YARN_CONF_yarn_scheduler_capacity_root_default_maximum___allocation___vcores=2
    ports:
      - "8088:8088"  # ResourceManager Web UI
      - "8032:8032"  # ResourceManager
    volumes:
      - "./:/opt/shared:rw"
    networks:
      - hadoop-yarn
    depends_on:
      - namenode
      - datanode
    env_file:
      - .env

  # YARN NodeManager
  nodemanager:
    container_name: ${NODEMANAGER_CONTAINER_NAME}
    image: bde2020/hadoop-nodemanager:2.0.0-hadoop3.2.1-java8
    environment:
      - SERVICE_PRECONDITION=namenode:9000 namenode:9870 datanode:9864 resourcemanager:8088
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - CORE_CONF_hadoop_http_staticuser_user=root
      - YARN_CONF_yarn_log___aggregation___enable=true
      - YARN_CONF_yarn_log_server_url=http://historyserver:8188/applicationhistory/logs/
      - YARN_CONF_yarn_resourcemanager_recovery_enabled=true
      - YARN_CONF_yarn_resourcemanager_store_class=org.apache.hadoop.yarn.server.resourcemanager.recovery.FileSystemRMStateStore
      - YARN_CONF_yarn_nodemanager_aux___services=mapreduce_shuffle
      - YARN_CONF_yarn_nodemanager_aux___services_mapreduce___shuffle_class=org.apache.hadoop.mapred.ShuffleHandler
      - YARN_CONF_yarn_nodemanager_resource_memory___mb=2048
      - YARN_CONF_yarn_nodemanager_resource_cpu___vcores=2
      - YARN_CONF_yarn_nodemanager_disk___health___checker_max___disk___utilization___per___disk___percentage=98.5
      - YARN_CONF_yarn_nodemanager_remote___app___log___dir=/app-logs
      - YARN_CONF_yarn_nodemanager_log___dirs=/var/log/hadoop-yarn/container
    ports:
      - "8042:8042"  # NodeManager Web UI
    volumes:
      - "./:/opt/shared:rw"
    networks:
      - hadoop-yarn
    depends_on:
      - namenode
      - datanode
      - resourcemanager
    env_file:
      - .env

  # Spark History Server
  historyserver:
    container_name: ${HISTORYSERVER_CONTAINER_NAME}
    image: bde2020/hadoop-historyserver:2.0.0-hadoop3.2.1-java8
    environment:
      - SERVICE_PRECONDITION=namenode:9000 namenode:9870 datanode:9864 resourcemanager:8088
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - CORE_CONF_hadoop_http_staticuser_user=root
      - YARN_CONF_yarn_log___aggregation___enable=true
      - YARN_CONF_yarn_log_server_url=http://historyserver:8188/applicationhistory/logs/
      - YARN_CONF_yarn_resourcemanager_recovery_enabled=true
      - YARN_CONF_yarn_resourcemanager_store_class=org.apache.hadoop.yarn.server.resourcemanager.recovery.FileSystemRMStateStore
    ports:
      - "8188:8188"  # History Server Web UI
    volumes:
      - "./:/opt/shared:rw"
    networks:
      - hadoop-yarn
    depends_on:
      - namenode
      - datanode
      - resourcemanager
    env_file:
      - .env

  # Spark Client with YARN support
  spark-client:
    build:
      context: .
      dockerfile: Dockerfile.spark-client
    container_name: ${SPARK_CLIENT_CONTAINER_NAME}
    environment:
      - SPARK_MASTER=yarn
      - HADOOP_CONF_DIR=/etc/hadoop
      - YARN_CONF_DIR=/etc/hadoop
      - CLASSPATH=/opt/spark/jars/*:/opt/hadoop/share/hadoop/common/*:/opt/hadoop/share/hadoop/hdfs/*:/opt/hadoop/share/hadoop/yarn/*
    volumes:
      - "./:/opt/shared:rw"
      - "./local/jars/:/opt/spark/jars/"
      - "./config/spark/:/opt/spark/conf/"
      - "./config/hadoop/:/etc/hadoop/"
    networks:
      - hadoop-yarn
    command: ["sleep", "infinity"]
    depends_on:
      - namenode
      - datanode
      - resourcemanager
      - nodemanager
    env_file:
      - .env

volumes:
  hadoop_namenode:
  hadoop_datanode:

networks:
  hadoop-yarn:
    driver: bridge